# OpsMeridian. The database keeps its original name (rootline) so existing volumes keep working.
# Production-like stack: PostgreSQL with pgvector, Redis (BullMQ), API, separate worker, web.
#   docker compose up -d --build   → http://localhost:3100
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment: { POSTGRES_USER: rootline, POSTGRES_PASSWORD: rootline, POSTGRES_DB: rootline }
    volumes: [pg:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD", "pg_isready", "-U", "rootline"], interval: 5s, retries: 20 }
  redis:
    image: redis:7-alpine
  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    depends_on: { postgres: { condition: service_healthy }, redis: { condition: service_started } }
    environment: &apienv
      DATABASE_URL: postgresql://rootline:rootline@postgres:5432/rootline
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change-me-change-me-change-me}
      WEB_ORIGIN: http://localhost:3100
      INGEST_TOKEN: ${INGEST_TOKEN:-rl_dev_ingest_token}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      SIMULATOR: ${SIMULATOR:-on}
      WORKER: "off"
    ports: ["4100:4100"]
  worker:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    depends_on: [api]
    environment: *apienv
    command: ["npx", "--workspace", "apps/api", "tsx", "src/worker-main.ts"]
    deploy: { replicas: 2 }
  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    depends_on: [api]
    ports: ["3100:3100"]
  # Billing ETL (optional, 2–4 GB RAM):  docker compose --profile nifi up -d   then   node infra/nifi/setup-flow.mjs
  nifi-driver:
    profiles: [nifi]
    image: curlimages/curl:8.11.1
    user: root
    volumes: ["nifi-drivers:/drivers"]
    command: ["-fsSL", "-o", "/drivers/postgresql.jar", "https://repo1.maven.org/maven2/org/postgresql/postgresql/42.7.7/postgresql-42.7.7.jar"]
  nifi:
    profiles: [nifi]
    image: apache/nifi:2.9.0
    depends_on: { nifi-driver: { condition: service_completed_successfully }, postgres: { condition: service_healthy } }
    environment:
      SINGLE_USER_CREDENTIALS_USERNAME: admin
      SINGLE_USER_CREDENTIALS_PASSWORD: ${NIFI_PASSWORD:-opsmeridian-local-nifi}
      NIFI_WEB_PROXY_HOST: localhost:8443
      NIFI_JVM_HEAP_MAX: 2g
    ports: ["127.0.0.1:8443:8443"]
    volumes: ["nifi-drivers:/drivers:ro", "./infra/nifi/billing:/billing"]
    mem_limit: 4g
volumes: { pg: {}, nifi-drivers: {} }
