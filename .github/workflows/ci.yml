name: CI
on: { push: { branches: [main] }, pull_request: {} }
jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: rootline, POSTGRES_PASSWORD: rootline, POSTGRES_DB: rootline_test }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U rootline" --health-interval 5s --health-retries 20
    env: { TEST_DATABASE_URL: "postgresql://rootline:rootline@localhost:5432/rootline_test" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm -w apps/api run typecheck
      - run: npm -w apps/api test
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm -w apps/web run typecheck
      - run: npm -w apps/web run build
